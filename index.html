<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Table</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }

    th {
      background: #f4f4f4;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    #status {
      color: #888;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <p id="status">Loading...</p>
  <div id="table-container"></div>

  <script>
    async function loadTable() {
      const status = document.getElementById("status");
      const container = document.getElementById("table-container");

      try {
        const response = await fetch("data/spreadsheet.json");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const records = await response.json();

        if (!records.length) {
          status.textContent = "No data found.";
          return;
        }

        const headers = Object.keys(records[0]);
        const table = document.createElement("table");

        // Header row
        const thead = table.createTHead();
        const headerRow = thead.insertRow();
        headers.forEach(h => {
          const th = document.createElement("th");
          th.textContent = h;
          headerRow.appendChild(th);
        });

        // Data rows
        const tbody = table.createTBody();
        records.forEach(record => {
          const row = tbody.insertRow();
          headers.forEach(h => {
            const cell = row.insertCell();
            cell.textContent = record[h] ?? "";
          });
        });

        container.appendChild(table);
        status.textContent = `${records.length} rows loaded.`;

      } catch (err) {
        status.textContent = `Failed to load data: ${err.message}`;
      }
    }

    loadTable();
  </script>
</body>
</html>
